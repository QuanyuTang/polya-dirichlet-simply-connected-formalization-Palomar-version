# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Strict Dirichlet Pólya inequality on simply connected planar domains"
  description: >-
    A Lean 4 formalization of the strict Dirichlet Pólya inequality for bounded,
    open, simply connected planar domains, including the indexed eigenvalue and
    counting formulations.
  authors:
    - "Quanyu Tang"
    - "Zuoqin Wang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Quanyu Tang"
    - "Zuoqin Wang"

classification:
  arxiv: ["math.SP", "math.AP"]
  msc2020: ["35P15", "35J05"]

sources:
  - title: "Strict Dirichlet Pólya inequality on simply connected planar domains"
    authors:
      - "Quanyu Tang"
      - "Zuoqin Wang"
    type: "paper"
    location: "Accompanying manuscript in preparation for public release on arXiv"
    relationship: "formalizes"
    note: "The Lean development formalizes the principal strict Dirichlet inequality and its counting formulation. Add the public arXiv e-print identifier here once available."

related_formalizations:
  - id: "https://github.com/QuanyuTang/polya-dirichlet-simply-connected-formalization/commit/0c42251e2b602c9b49db6f2c37a9d27c858d1475"
    relationship: "builds-on"
    note: "This Palomar-compatible repository ports the earlier Lean 4.28.0 formalization and adds the Challenge/Solution/Comparator structure, pinned Palomar toolchain, and independent-kernel checks."

status:
  scope: >-
    The repository contains both the variational and operator-spectral Dirichlet
    Pólya developments. The Palomar Challenge/Solution pair advertises the
    variational strict inequality PalomarDirichlet.main_result, whose statement
    is the min-max form identified with the operator eigenvalues by the proved
    bridge in RequestProject/MainSpectral.lean. The operator-spectral theorems
    main and main_counting remain in RequestProject/MainSpectral.lean and are
    re-exported by RequestProject/Main.lean, but are not selected by this
    Comparator configuration. Challenge.lean contains one deliberate sorry
    in the statement declaration; the substantive proof source and Solution
    contain no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Aristotle", "Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "AI-assisted formalization, local Lean compilation, and independent source and axiom audits."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local development machine"
      prompting_notes: "Proofs were developed from a self-contained mathematical statement and checked in Lean."
  spend_usd: "subscription-based"
  notes: "The human authors reviewed the statement, proof scope, dependencies, and axiom reports. No independent peer review is claimed."

fidelity:
  divergences: >-
    The Palomar Comparator advertises the variational strict inequality. The
    source also proves the stronger operator-spectral declarations main and
    main_counting. The proved bridge identifies the variational min-max
    eigenvalues with the ordered positive eigenvalues of the constructed
    Dirichlet operator; the larger spectral declarations remain available in
    the source development but are not selected by this small Challenge surface.

review:
  status: "self-assessed"
  reviewers: []
  notes: "The authors performed a self-audit of the statement, proof scope, dependencies, and axiom reports. Palomar registered PALOMAR-2026-10-09-000003 v1 after mechanical verification and automated editorial review identified no problems. No independent peer review is claimed."

alignment:
  namespace: "PalomarDirichlet"
  statements:
    - source: "Strict variational Dirichlet Pólya inequality"
      lean: "PalomarDirichlet.main_result"
      module: "Challenge.lean and Solution.lean"
      status: "proved"
      note: "The Comparator declaration has exactly the statement of strict_polya_variational in RequestProject/MainSpectral.lean."
    - source: "Operator-spectral indexed theorem (retained source result)"
      lean: "main"
      module: "RequestProject/MainSpectral.lean"
      status: "proved"
      note: "This stronger operator-spectral theorem is present in the substantive source and is axiom-audited, but is not selected by the current Palomar Comparator configuration."
    - source: "Operator-spectral counting theorem (retained source result)"
      lean: "main_counting"
      module: "RequestProject/MainSpectral.lean"
      status: "proved"
      note: "This counting theorem is present in the substantive source and is axiom-audited, but is not selected by the current Palomar Comparator configuration."

acknowledgements: "Lean 4, Mathlib, Aristotle, Codex, and the authors' human review."

